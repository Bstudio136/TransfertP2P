<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0a0e14" />
<title>Transfert P2P — envoi de fichiers entre téléphones</title>
<style>
  *,*::before,*::after{box-sizing:border-box}

  :root{
    color-scheme: dark;
    --bg:#0a0e14;
    --bg-grad:radial-gradient(ellipse at 50% -10%, #141b25 0%, #0a0e14 65%);
    --card:#141b25;
    --card2:#1c2532;
    --text:#e9eff7;
    --muted:#8fa0b6;
    --border:#26303f;
    --accent:#f5b915;
    --accent-hi:#fbbf24;
    --accent-lo:#b8860b;
    --on-accent:#1a1200;
    --accent-soft:rgba(245,185,21,.12);
    --ok:#22c55e;
    --err:#ef4444;
    --warn:#f59e0b;
    --radius:18px;
    --shadow:0 10px 40px -10px rgba(0,0,0,.55);
    --footer-h:72px;
  }

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme: light;
      --bg:#f5efe0;
      --bg-grad:radial-gradient(ellipse at 50% -10%, #fff9e6 0%, #f5efe0 65%);
      --card:#ffffff; --card2:#faf6ec; --text:#1a1200; --muted:#6b5b3e;
      --border:#e8dfc9; --accent:#d4a017; --accent-hi:#e8b923; --accent-lo:#8a6508;
      --on-accent:#1a1200; --accent-soft:rgba(212,160,23,.14);
      --ok:#16a34a; --err:#dc2626; --warn:#d97706;
      --shadow:0 10px 40px -12px rgba(107,91,62,.18);
    }
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#f5efe0;
    --bg-grad:radial-gradient(ellipse at 50% -10%, #fff9e6 0%, #f5efe0 65%);
    --card:#ffffff; --card2:#faf6ec; --text:#1a1200; --muted:#6b5b3e;
    --border:#e8dfc9; --accent:#d4a017; --accent-hi:#e8b923; --accent-lo:#8a6508;
    --on-accent:#1a1200; --accent-soft:rgba(212,160,23,.14);
    --ok:#16a34a; --err:#dc2626; --warn:#d97706;
    --shadow:0 10px 40px -12px rgba(107,91,62,.18);
  }

  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--bg);
    background-image:var(--bg-grad);
    background-attachment:fixed;
    color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(var(--footer-h) + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .25s ease,color .25s ease;
  }
  .app{max-width:560px;margin:0 auto}

  @media (min-width: 640px){
    body{padding:24px 24px calc(var(--footer-h) + env(safe-area-inset-bottom))}
    .app{max-width:600px}
  }
  @media (min-width: 900px){
    body{padding:32px 32px calc(var(--footer-h) + env(safe-area-inset-bottom))}
    .app{max-width:720px}
    .btn{min-height:72px;font-size:1.06rem}
  }

  .header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
  h1{font-size:clamp(1.3rem, 3.2vw + .8rem, 1.75rem);margin:0;letter-spacing:-.02em;line-height:1.1}
  h1 span{color:var(--accent)}
  .header-actions{display:flex;gap:8px;flex:none;align-items:flex-start}

  .theme-toggle{
    width:44px;height:44px;flex:none;border-radius:50%;
    border:1px solid var(--border);background:var(--card);color:var(--text);
    font-size:.82rem;font-weight:800;letter-spacing:.03em;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .15s,background .2s,border-color .2s;
    box-shadow:var(--shadow);
  }
  .theme-toggle:hover{background:var(--card2);border-color:var(--accent)}
  .theme-toggle:active{transform:scale(.94)}

  /* Langue : wrapper + menu déroulant */
  .lang-wrap{position:relative}
  .lang-menu{
    position:absolute;top:calc(100% + 8px);right:0;
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:6px;min-width:170px;
    box-shadow:0 16px 48px -8px rgba(0,0,0,.45);
    z-index:60;display:flex;flex-direction:column;gap:2px;
    animation:pop .15s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
  .lang-menu[hidden]{display:none}
  .lang-menu button{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:10px;
    background:transparent;border:none;color:var(--text);
    font-size:.9rem;font-weight:600;cursor:pointer;text-align:left;
    transition:background .12s;
  }
  .lang-menu button:hover{background:var(--card2)}
  .lang-menu button[aria-current="true"]{
    background:var(--accent-soft);color:var(--accent);
  }
  .lang-menu button .flag{font-size:1.05rem}

  .sub{color:var(--muted);font-size:.8rem;margin:0 0 20px;display:flex;gap:6px;flex-wrap:wrap}
  .pill{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:4px 10px;font-size:.7rem;
    box-shadow:var(--shadow);
  }
  .pill b{color:var(--accent);font-weight:700}

  .view{display:none}
  .view.active{display:block;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  button{font:inherit}
  .btn{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
    min-height:68px;padding:14px 18px;margin-bottom:12px;
    background:var(--card);color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius);
    font-size:1.02rem;font-weight:600;cursor:pointer;text-align:left;
    transition:transform .1s ease,background .15s ease,border-color .15s ease,box-shadow .2s;
    box-shadow:var(--shadow);
  }
  .btn:hover{background:var(--card2)}
  .btn:active{transform:scale(.98)}
  .btn.primary{
    background:var(--accent);border-color:var(--accent);color:var(--on-accent);
    font-weight:700;box-shadow:0 8px 28px -10px var(--accent);
  }
  .btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi);
    box-shadow:0 10px 32px -8px var(--accent);}
  .btn.ghost{
    background:transparent;font-weight:500;min-height:52px;font-size:.92rem;
    color:var(--muted);justify-content:center;box-shadow:none;
  }
  .btn.ghost:hover{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}
  .btn:disabled{opacity:.45;pointer-events:none}
  .btn small{display:block;font-weight:400;font-size:.75rem;opacity:.85;margin-top:2px}
  .ico{font-size:1.6rem;line-height:1;flex:none;
       transition:transform .25s ease;}
  .btn:hover .ico{transform:scale(1.12) rotate(-4deg)}
  .btn.primary:hover .ico{transform:scale(1.15) rotate(6deg)}

  /* Effet ripple */
  .ripple{
    position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 70%);
    transform:scale(0);opacity:.9;
    animation:rippleAnim .6s ease-out;
  }
  .btn.primary .ripple{background:radial-gradient(circle, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 70%)}
  @keyframes rippleAnim{to{transform:scale(2.5);opacity:0}}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:clamp(2rem, 8vw, 2.8rem);font-weight:700;
    letter-spacing:.35rem;text-align:center;padding:12px 0 8px;
    color:var(--accent);user-select:all;-webkit-user-select:all;text-indent:.35rem;
    text-shadow:0 0 24px var(--accent-soft);
    animation:codePulse 2.6s ease-in-out infinite;
  }
  @keyframes codePulse{
    0%,100%{text-shadow:0 0 24px var(--accent-soft);transform:scale(1)}
    50%{text-shadow:0 0 36px var(--accent), 0 0 60px var(--accent-soft);transform:scale(1.015)}
  }
  .code-actions{display:flex;gap:8px;margin-top:8px}
  .code-actions .btn{flex:1;margin:0;min-height:44px;font-size:.82rem;padding:10px}

  label{
    display:block;font-size:.74rem;color:var(--muted);margin:16px 0 6px;
    font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  }
  input[type=text],textarea{
    width:100%;background:var(--card2);color:var(--text);
    border:1px solid var(--border);border-radius:12px;padding:14px;font:inherit;
    outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]:focus,textarea:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  input#join-code{
    font-size:clamp(1.4rem, 6vw, 1.8rem);text-align:center;letter-spacing:.35rem;
    font-family:ui-monospace,monospace;padding:16px 10px;
  }
  textarea{
    min-height:92px;font-family:ui-monospace,monospace;font-size:.7rem;
    word-break:break-all;resize:vertical;line-height:1.35;
  }

  .status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.88rem;margin:12px 0 0}
  .status.ok{color:var(--ok)}
  .status.err{color:var(--err)}
  .status.ok::before{
    content:'';display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--ok);flex:none;
    animation:pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55);transform:scale(1)}
    50%{box-shadow:0 0 0 7px rgba(34,197,94,0);transform:scale(1.15)}
  }
  .spinner{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--accent);
           border-radius:50%;animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .session-card{padding:12px 16px}
  .stats{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    font-size:.72rem;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums;
  }
  .stats .stat{display:inline-flex;align-items:center;gap:4px}
  .stats .stat b{color:var(--text);font-weight:700}
  .stats .sep{opacity:.4}
  .rtt-good{color:var(--ok)}.rtt-mid{color:var(--warn)}.rtt-bad{color:var(--err)}

  .file{
    position:relative;
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;
    animation:slideIn .28s cubic-bezier(.2,.9,.3,1.3);
    box-shadow:var(--shadow);
    transition:border-color .2s;
  }
  @keyframes slideIn{
    from{opacity:0;transform:translateY(-10px) scale(.97)}
    to{opacity:1;transform:none}
  }
  .file .row{display:flex;align-items:center;gap:10px}
  .file .file-icon{
    width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);border-radius:10px;font-size:1.15rem;
    transition:transform .3s;
  }
  .file.done .file-icon{background:rgba(34,197,94,.15);animation:popIn .4s ease}
  .file.bad  .file-icon{background:rgba(239,68,68,.15)}
  @keyframes popIn{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
  .file .name{
    font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;flex:1;min-width:0;
  }
  .file .meta{font-size:.72rem;color:var(--muted);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
  .bar{
    height:8px;background:var(--card2);border-radius:99px;overflow:hidden;
    margin-top:10px;border:1px solid var(--border);
  }
  .bar>i{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent-lo),var(--accent),var(--accent-hi));
    transition:width .2s ease;
  }
  /* Shimmer pendant le transfert */
  .file:not(.done):not(.bad) .bar>i{
    background:linear-gradient(90deg,
      var(--accent-lo) 0%, var(--accent) 30%, var(--accent-hi) 50%,
      var(--accent) 70%, var(--accent-lo) 100%);
    background-size:200% 100%;
    animation:shimmer 1.6s linear infinite;
  }
  @keyframes shimmer{to{background-position:-200% 0}}
  .file.done .bar>i{
    background:var(--ok);
    box-shadow:0 0 12px rgba(34,197,94,.6);
  }
  .file.bad  .bar>i{background:var(--err)}
  .file.done{border-color:rgba(34,197,94,.5);animation:successPulse .7s ease-out}
  @keyframes successPulse{
    0%{box-shadow:var(--shadow),0 0 0 0 rgba(34,197,94,.55)}
    100%{box-shadow:var(--shadow),0 0 0 18px rgba(34,197,94,0)}
  }
  .file.bad{border-color:rgba(239,68,68,.5);animation:shake .4s ease-out}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    40%{transform:translateX(5px)}
    60%{transform:translateX(-3px)}
    80%{transform:translateX(3px)}
  }
  .file .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .file .actions a,.file .actions button{
    flex:1 1 auto;text-align:center;padding:11px;border-radius:11px;
    border:1px solid var(--border);background:var(--card2);color:var(--text);
    font-size:.83rem;font-weight:600;text-decoration:none;cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s;min-width:110px;
    position:relative;overflow:hidden;
  }
  .file .actions a:hover,.file .actions button:hover{
    border-color:var(--accent);background:var(--accent-soft);
  }
  .file .actions a:active,.file .actions button:active{transform:scale(.97)}
  .file .actions .cancel-btn{color:var(--err)}
  .file .actions .cancel-btn:hover{border-color:var(--err);background:rgba(239,68,68,.1)}
  .file .actions .cancel-btn.confirming{
    animation:pulseWarn 1s ease-in-out infinite;
  }
  @keyframes pulseWarn{
    0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}
    50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}
  }

  .main-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .main-actions .btn{flex:1;margin-bottom:0;min-width:140px}

  .drop-overlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    z-index:90;pointer-events:none;margin:12px;border-radius:24px;
    background:var(--accent-soft);border:4px dashed var(--accent);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    font-size:clamp(1.1rem,3vw,1.5rem);font-weight:700;color:var(--accent);
    text-align:center;padding:24px;
  }
  body.dragging .drop-overlay{display:flex;animation:dropPulse 1.2s ease-in-out infinite}
  @keyframes dropPulse{
    0%,100%{border-color:var(--accent);background:var(--accent-soft)}
    50%{border-color:var(--accent-hi);background:rgba(245,185,21,.2)}
  }

  .hint{font-size:.78rem;color:var(--muted);line-height:1.55}
  .toggle{
    display:flex;align-items:flex-start;gap:10px;margin-top:6px;font-size:.85rem;
    color:var(--muted);cursor:pointer;padding:12px;background:var(--card);
    border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
    transition:border-color .15s,background .15s;
  }
  .toggle:hover{border-color:var(--accent)}
  .toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:1px 0 0}

  .footer{
    position:fixed;left:0;right:0;bottom:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    text-align:center;font-size:.72rem;color:var(--muted);
    background:var(--bg);border-top:1px solid var(--border);
    z-index:50;box-shadow:0 -6px 24px -12px rgba(0,0,0,.35);line-height:1.2;
  }
  .footer a{
    color:var(--accent);text-decoration:none;font-weight:800;
    letter-spacing:.02em;transition:color .15s;
  }
  .footer a:hover{color:var(--accent-hi);text-decoration:underline}
  @media (min-width: 640px){
    .footer{font-size:.78rem;padding:14px 24px calc(14px + env(safe-area-inset-bottom))}
    :root{--footer-h:76px}
  }

  #toast{
    position:fixed;left:50%;bottom:calc(var(--footer-h) + 16px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;
    font-size:.85rem;font-weight:600;transition:opacity .22s ease;z-index:99;
    max-width:90vw;text-align:center;box-shadow:0 12px 40px -8px rgba(0,0,0,.5);
  }
  #toast.show{
    opacity:1;
    animation:toastBounce .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes toastBounce{
    0%{transform:translate(-50%,20px) scale(.9)}
    60%{transform:translate(-50%,-4px) scale(1.04)}
    100%{transform:translate(-50%,0) scale(1)}
  }

  /* Feedback "copié" sur les boutons */
  .btn.copied{
    border-color:var(--ok)!important;
    color:var(--ok)!important;
    animation:copyBounce .35s ease;
  }
  @keyframes copyBounce{
    0%{transform:scale(1)}
    50%{transform:scale(1.06)}
    100%{transform:scale(1)}
  }
</style>
</head>
<body>

<div class="drop-overlay" aria-hidden="true" id="drop-overlay">📥 Dépose pour envoyer</div>

<div class="app">

  <div class="header">
    <div>
      <h1 id="h1-title">Transfert<span>P2P</span></h1>
      <p class="sub" style="margin-bottom:0">
        <span class="pill">🔒 <b data-i18n="pill-secure">Chiffré</b> <span data-i18n="pill-secure-suffix">DTLS</span></span>
        <span class="pill">📡 <b data-i18n="pill-direct">Direct</b> <span data-i18n="pill-direct-suffix">téléphone → téléphone</span></span>
      </p>
    </div>
    <div class="header-actions">
      <div class="lang-wrap">
        <button class="theme-toggle" id="btn-lang" type="button" aria-label="Langue" aria-haspopup="true" aria-expanded="false">FR</button>
        <div class="lang-menu" id="lang-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-lang="fr"><span class="flag">🇫🇷</span><span>Français</span></button>
          <button type="button" role="menuitem" data-lang="en"><span class="flag">🇬🇧</span><span>English</span></button>
          <button type="button" role="menuitem" data-lang="it"><span class="flag">🇮🇹</span><span>Italiano</span></button>
          <button type="button" role="menuitem" data-lang="tr"><span class="flag">🇹🇷</span><span>Türkçe</span></button>
        </div>
      </div>
      <button class="theme-toggle" id="btn-theme" type="button" aria-label="Changer de thème">🌓</button>
    </div>
  </div>

  <!-- ===================== ACCUEIL ===================== -->
  <section class="view active" id="v-home" style="margin-top:20px">
    <button class="btn primary" id="btn-send">
      <span class="ico">📤</span>
      <span>
        <span data-i18n="send-title">Envoyer des fichiers</span>
        <small data-i18n="send-sub">Génère un code d'appairage</small>
      </span>
    </button>
    <button class="btn" id="btn-receive">
      <span class="ico">📥</span>
      <span>
        <span data-i18n="receive-title">Recevoir des fichiers</span>
        <small data-i18n="receive-sub">Saisis le code de l'autre téléphone</small>
      </span>
    </button>

    <label class="toggle">
      <input type="checkbox" id="chk-manual">
      <span>
        <strong style="color:var(--text)" data-i18n="manual-mode">Mode manuel</strong>
        <span data-i18n="manual-suffix">(sans serveur de signalisation)</span><br>
        <span style="font-size:.78rem" data-i18n="manual-desc">Échange de deux codes par copier-coller / SMS. Plus sûr, plus pénible.</span>
      </span>
    </label>

    <p class="hint" id="hint-home" style="margin-top:16px" data-i18n-html="hint-auto"></p>
  </section>

  <!-- ===================== HÔTE ===================== -->
  <section class="view" id="v-host">
    <div class="card">
      <div class="status" style="justify-content:center;margin:0;font-size:.74rem;
           text-transform:uppercase;letter-spacing:.06em;font-weight:700"
           data-i18n="pairing-code-label">Code d'appairage</div>
      <div class="code" id="host-code">······</div>
      <p class="hint" style="text-align:center;margin:0" data-i18n="pairing-code-hint">
        Saisis ce code sur l'autre téléphone (bouton « Recevoir »).
      </p>
      <div class="code-actions">
        <button class="btn ghost" id="btn-copy-code" type="button">📋 <span data-i18n="copy">Copier</span></button>
        <button class="btn ghost" id="btn-share-code" type="button">📤 <span data-i18n="share">Partager</span></button>
      </div>
      <div class="status" id="host-status"><span class="spinner"></span><span data-i18n="preparing">Préparation…</span></div>
    </div>

/* ============================================================
   1. Utilitaires
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function bytesToB64u(bytes){
  let bin = '';
  const STEP = 0x8000;
  for (let i = 0; i < bytes.length; i += STEP){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + STEP));
  }
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64uToBytes(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while (str.length % 4) str += '=';
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function packSDP(sdp){
  if (typeof CompressionStream === 'undefined'){
    return 'r' + bytesToB64u(new TextEncoder().encode(sdp));
  }
  const stream = new Blob([sdp]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const buf = await new Response(stream).arrayBuffer();
  return 'z' + bytesToB64u(new Uint8Array(buf));
}
async function unpackSDP(code){
  code = code.trim().replace(/\s+/g,'');
  const kind = code[0];
  const bytes = b64uToBytes(code.slice(1));
  if (kind === 'r') return new TextDecoder().decode(bytes);
  if (kind === 'z'){
    if (typeof DecompressionStream === 'undefined'){
      throw new Error(t('decomp-unavailable'));
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(stream).text();
  }
  throw new Error(t('code-unreadable'));
}

function fmtSize(n){
  if (n < 1024) return n + ' o';
  const u = ['Ko','Mo','Go','To'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i];
}

  if (ty.startsWith('video/') || ['mp4','mov','mkv','webm','avi','m4v','3gp','flv'].includes(ext)) return '🎬';
  if (ty.startsWith('audio/') || ['mp3','wav','ogg','m4a','flac','aac','opus'].includes(ext)) return '🎵';
  if (ty === 'application/pdf' || ext === 'pdf') return '📕';
  if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext)) return '📦';
  if (['doc','docx','odt','rtf','pages'].includes(ext)) return '📝';
  if (['xls','xlsx','ods','csv','numbers'].includes(ext)) return '📊';
  if (['ppt','pptx','odp','key'].includes(ext)) return '📽️';

  if (['js','ts','jsx','tsx','py','java','c','cpp','h','css','html','json','xml','yml','yaml','rs','go','php','sh'].includes(ext)) return '💻';

/* ============================================================
   2. Hachage
   ============================================================ */
const HASH_BLOCK = 4 * 1024 * 1024;
async function hashBlob(blob){
  if (!(window.crypto && crypto.subtle && crypto.subtle.digest)) return null;
  const parts = [];
  if (blob.size === 0){
    parts.push(new Uint8Array(await crypto.subtle.digest('SHA-256', new Uint8Array(0))));
  } else {
    for (let off = 0; off < blob.size; off += HASH_BLOCK){
      const buf = await blob.slice(off, off + HASH_BLOCK).arrayBuffer();
      parts.push(new Uint8Array(await crypto.subtle.digest('SHA-256', buf)));
    }
  }
  const total = parts.reduce((a, p) => a + p.length, 0);
  const all = new Uint8Array(total);
  let o = 0;
  for (const p of parts){ all.set(p, o); o += p.length; }
  return new Uint8Array(await crypto.subtle.digest('SHA-256', all));
}

function wirePC(){
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed'){
      onFatal(t('connect-failed'));
    }
  };
}
function waitIce(){
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve();
    const timer = setTimeout(done, 6000);
    function check(){ if (pc.iceGatheringState === 'complete') done(); }
    function done(){
      clearTimeout(timer);
      pc.removeEventListener('icegatheringstatechange', check);
      resolve();
    }
    pc.addEventListener('icegatheringstatechange', check);
  });
}
async function createOfferSDP(){
  pc = new RTCPeerConnection(ICE_CONFIG);
  wirePC();
  dc = pc.createDataChannel('ft', { ordered: true });
  setupChannel(dc);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIce();
  return pc.localDescription.sdp;
}
async function createAnswerSDP(offerSdp){
  pc = new RTCPeerConnection(ICE_CONFIG);
  wirePC();
  pc.ondatachannel = e => setupChannel(e.channel);
  await pc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await waitIce();
  return pc.localDescription.sdp;
}

/* ============================================================
   7. Data channel
   ============================================================ */
function setupChannel(channel){
  dc = channel;
  dc.binaryType = 'arraybuffer';
  dc.bufferedAmountLowThreshold = LOW_WATER;

  dc.onopen = () => {
    onConnected();
    try { dc.send(JSON.stringify({ t: 'hello' })); } catch(e){}
  };
  dc.onmessage = ev => {
    if (typeof ev.data === 'string') onControl(ev.data);
    else onBinary(ev.data);
  };
  dc.onclose = () => {
    stopPing(); stopSessionTimer();
    onFatal(t('channel-closed'));
  };
  dc.onerror = () => {};
}

function onControl(raw){
  let msg;
  try { msg = JSON.parse(raw); } catch(e){ return; }

  switch (msg.t){
    case 'hello':
      try { dc.send(JSON.stringify({ t: 'state', have: snapshotHave() })); } catch(_){}
      break;
    case 'state':
      haveRemote = msg.have || {};
      if (stateResolve) stateResolve();
      break;
    case 'file':
      prepareReceive(msg);
      break;
    case 'file-end':
      finishReceive(msg);
      break;
    case 'file-cancel': {
      /* FIX : on supprime le fichier côté receveur QUELLE QUE SOIT sa position
         (en cours OU déjà terminé). Le téléchargement devient impossible. */
      const key = nidMap.get(msg.nid);
      const st  = store.get(key);
      if (st){
        if (st.ui) removeFileUI(st.ui);
        if (st._blobUrl){ try { URL.revokeObjectURL(st._blobUrl); } catch(_){} st._blobUrl = null; }
        st.cancelled = true;
        store.delete(key);
        toast(t('cancelled-by-sender'));
        vibrate(25);
      }
      nidMap.delete(msg.nid);
      try { dc.send(JSON.stringify({ t: 'state', have: snapshotHave() })); } catch(_){}
      break;
    }
    case 'ping':
      try { dc.send(JSON.stringify({ t: 'pong', ts: msg.ts })); } catch(_){}
      break;
    case 'pong':
      currentRtt = performance.now() - msg.ts;
      updateRttDisplay();
      break;
  }
}

function snapshotHave(){
  const out = {};
  store.forEach((st, key) => { out[key] = st.bytes; });
  return out;
}

function prepareReceive(msg){
  let st = store.get(msg.key);
  if (!st || st.bytes > msg.size){
    st = { name: msg.name, size: msg.size, type: msg.type || '', hash: msg.hash,
           chunks: [], bytes: 0, ui: null, done: false, cancelled: false, _blobUrl: null };
    store.set(msg.key, st);
  }
  nidMap.set(msg.nid, msg.key);

  const ui = uiAddFile('in', msg.name, msg.size, st.bytes, { type: msg.type });
  st.ui = ui;
  if (st.done){
    ui.el.classList.add('done');
    ui.update(msg.size, t('already-received'));
    addDownloadActions(ui, st);
  }
}

function onBinary(ab){
  const u8 = new Uint8Array(ab);
  if (u8.length < 9 || u8[0] !== 1) return;
  const dv  = new DataView(ab);
  const nid = dv.getUint32(1);
  const idx = dv.getUint32(5);

  const key = nidMap.get(nid);
  if (!key) return;
  const st = store.get(key);
  if (!st || st.cancelled) return;

  if (idx !== st.chunks.length) return;

  const payload = u8.slice(9);
  st.chunks.push(payload);
  st.bytes += payload.length;

  if (st.ui){
    st.ui.update(st.bytes, fmtSize(st.bytes) + ' / ' + fmtSize(st.size) +
      '  (' + Math.floor(st.bytes / st.size * 100) + '%)');
  }
}

async function finishReceive(msg){
  const key = nidMap.get(msg.nid);
  const st  = store.get(key);
  if (!st || st.cancelled) return;

  const blob = new Blob(st.chunks, { type: st.type || 'application/octet-stream' });

  if (blob.size !== st.size){
    if (st.ui){ st.ui.el.classList.add('bad'); st.ui.update(blob.size, t('wrong-size')); }
    toast(t('file-incomplete') + st.name);
    st.chunks = []; st.bytes = 0; st.blob = null; st.done = false;
    return;
  }
  const actual = await hashBlob(blob);
  /* FIX : le fichier a pu être annulé pendant await hashBlob() */
  if (st.cancelled || !store.has(key)) return;
  if (st.hash && actual && bytesToB64u(actual) !== st.hash){
    if (st.ui){ st.ui.el.classList.add('bad'); st.ui.update(st.size, t('bad-hash')); }
    toast(t('file-corrupted') + st.name);
    return;
  }

  st.blob = blob;
  st.done = true;
  if (st.ui){
    st.ui.el.classList.add('done');
    st.ui.update(st.size, t('verified') + fmtSize(st.size));
    addDownloadActions(st.ui, st);
  }
  toast(t('received') + st.name);
  vibrate(40);
}

function addDownloadActions(ui, st){
  if (st._blobUrl){ try { URL.revokeObjectURL(st._blobUrl); } catch(_){} st._blobUrl = null; }
  const box = ui.actions;
  box.hidden = false;
  box.innerHTML = '';

  const file = new File([st.blob], st.name, { type: st.type || 'application/octet-stream' });

  if (navigator.canShare && navigator.canShare({ files: [file] })){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = '📤 ' + t('share');
    b.onclick = () => navigator.share({ files: [file] }).catch(() => {});
    box.appendChild(b);
  }

  const url = URL.createObjectURL(st.blob);
  st._blobUrl = url;
  ui._blobUrl = url;
  const a = document.createElement('a');
  a.href = url;
  a.download = st.name;
  a.textContent = t('download');
  box.appendChild(a);
}

/* ============================================================
   8. Envoi
   ============================================================ */
async function waitBuffer(nid){
  while (dc && dc.readyState === 'open' && dc.bufferedAmount > HIGH_WATER){
    if (nid != null && cancelled.has(nid)) throw new Error('__CANCELLED__');
    await new Promise(r => setTimeout(r, 40));
  }
  if (!dc || dc.readyState !== 'open') throw new Error(t('channel-closed-short'));
}

async function sendOne(file){
  let ui = null;
  let nid = null;

  try {
    const key  = fileKey(file);
    const hash = await hashBlob(file);
    nid = ++nidSeq;
    nidMap.set(nid, key);

    dc.send(JSON.stringify({
      t: 'file', nid, key,
      name: file.name, size: file.size, type: file.type,
      hash: hash ? bytesToB64u(hash) : null
    }));

    const already = Math.max(0, Math.min(file.size, haveRemote[key] || 0));
    const totalChunks = Math.ceil(file.size / CHUNK);
    const startChunk  = Math.min(totalChunks, Math.floor(already / CHUNK));

    ui = uiAddFile('out', file.name, file.size, startChunk * CHUNK, {
      type: file.type,
      onCancel: () => {
        if (nid == null || cancelled.has(nid)) return;
        cancelled.add(nid);
        removeFileUI(ui);                       // ← retrait immédiat
        try { dc.send(JSON.stringify({ t: 'file-cancel', nid })); } catch(e){}
        vibrate(20);
      }
    });

    if (startChunk > 0 && startChunk < totalChunks){
      toast(t('resume-at') + file.name + t('resume-at-suffix') +
            Math.floor(startChunk * CHUNK / file.size * 100) + '%');
    }

    const t0 = performance.now();
    let sent = startChunk * CHUNK;
    let lastUi = 0;
    let lastBytes = sent, lastTime = t0, smoothedSpeed = 0;

    for (let i = startChunk; i < totalChunks; i++){
      if (cancelled.has(nid)) throw new Error('__CANCELLED__');
      await waitBuffer(nid);
      if (cancelled.has(nid)) throw new Error('__CANCELLED__');

      const start = i * CHUNK;
      const buf = await file.slice(start, Math.min(start + CHUNK, file.size)).arrayBuffer();
      if (cancelled.has(nid)) throw new Error('__CANCELLED__');

      const out = new Uint8Array(9 + buf.byteLength);
      const dv  = new DataView(out.buffer);
      dv.setUint8(0, 1);
      dv.setUint32(1, nid);
      dv.setUint32(5, i);
      out.set(new Uint8Array(buf), 9);

      dc.send(out.buffer);
      sent += buf.byteLength;

      const now = performance.now();
      if (now - lastUi > 120 || i === totalChunks - 1){
        if (now - lastTime > 250){
          const inst = (sent - lastBytes) / ((now - lastTime) / 1000);
          smoothedSpeed = smoothedSpeed === 0 ? inst : smoothedSpeed * 0.7 + inst * 0.3;
          lastBytes = sent; lastTime = now;
        }
        lastUi = now;
        ui.update(sent, fmtSize(sent) + ' / ' + fmtSize(file.size) +
          (smoothedSpeed > 0 ? '  · ' + fmtSize(smoothedSpeed) + '/s' : ''));
      }
    }

    if (cancelled.has(nid)) throw new Error('__CANCELLED__');

    dc.send(JSON.stringify({ t: 'file-end', nid }));
    ui.el.classList.add('done');
    ui.update(file.size, t('sent') + fmtSize(file.size));
    vibrate(30);
  } catch (e){
    const isCancel = e.message === '__CANCELLED__' || (nid != null && cancelled.has(nid));
    if (isCancel){
      cancelled.delete(nid);
      if (nid != null) nidMap.delete(nid);
      if (ui) removeFileUI(ui);
      return;
    }
    if (!ui) ui = uiAddFile('out', file.name, file.size, 0, { type: file.type });
    ui.el.classList.add('bad');
    ui.update(0, '✘ ' + e.message);
    throw e;
  }
}

async function processQueue(){
  if (busy) return;
  busy = true;
  try{
    if (statePromise) await statePromise;
    while (queue.length){
      if (!dc || dc.readyState !== 'open') throw new Error(t('channel-closed-short'));
      const f = queue.shift();
      try { await sendOne(f); } catch(e){ /* UI déjà màj */ }
    }
  }catch(e){
    onFatal(e.message);
  }finally{
    busy = false;
  }
}
function queueFiles(files){
  for (const f of files) queue.push(f);
  processQueue();
}

/* ============================================================
   9. Signalisation
   ============================================================ */
function subscribe(topic, onMsg, onFail){
  const src = new EventSource(NTFY + topic + '/sse');
  let errors = 0;
  src.onopen = () => { errors = 0; };
  src.onmessage = ev => {
    try{
      const d = JSON.parse(ev.data);
      if (d.event !== 'message') return;
      onMsg(JSON.parse(d.message));
    }catch(_){}
  };
  src.onerror = () => { if (++errors >= 4 && onFail) onFail(); };
  return src;
}
async function publish(topic, payload){
  await fetch(NTFY + topic, { method: 'POST', body: JSON.stringify(payload) });
}

/* ============================================================
   10. Hôte
   ============================================================ */
async function startHost(){
  cleanup();
  role = 'host';
  sessionStart = Date.now();
  pairingCode = String(Math.floor(100000 + Math.random() * 900000));

  $('#host-code').textContent = pairingCode;
  $('#host-manual').hidden = (mode !== 'manual');
  $('#host-offer').value = '';
  $('#host-answer-in').value = '';
  $('#file-list').innerHTML = '';
  setHostStatus(t('preparing'), 'spin');
  showView('v-host');

  try{
    const sdp = await createOfferSDP();

    if (mode === 'manual'){
      $('#host-offer').value = await packSDP(sdp);
      setHostStatus(t('manual-step-2-host'), '');
    }else{
      const topic = TOPIC_PREFIX + pairingCode;
      es = subscribe(topic, async msg => {
        if (msg.t !== 'answer') return;
        if (msg.ts < sessionStart - 15000) return;
        if (!pc || pc.signalingState !== 'have-local-offer') return;
        clearInterval(offerTimer); offerTimer = null;
        try{
          await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
          setHostStatus(t('answer-received'), 'spin');
        }catch(e){
          setHostStatus(t('answer-invalid'), 'err');
        }
      }, () => setHostStatus(t('signal-error'), 'err'));

      const pub = () => publish(topic, { t: 'offer', sdp, ts: Date.now() }).catch(() => {});
      pub();
      offerTimer = setInterval(pub, 2500);
      setHostStatus(t('waiting-peer'), 'spin');
    }
  }catch(e){
    setHostStatus(t('error-prefix') + ' : ' + e.message, 'err');
  }
}

function setHostStatus(text, kind){
  const el = $('#host-status');
  el.className = 'status' + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : '');
  el.innerHTML = (kind === 'spin' ? '<span class="spinner"></span>' : '') + '<span></span>';
  el.lastChild.textContent = text;
}

/* ============================================================
   11. Rejoindre
   ============================================================ */
async function joinWithCode(){
  const code = $('#join-code').value.replace(/\D/g, '');
  if (code.length !== 6){ toast(t('enter-6-digits')); return; }

  cleanup();
  role = 'join';
  joinedOnce = false;
  sessionStart = Date.now();
  pairingCode = code;
  $('#file-list').innerHTML = '';

  const st = $('#join-status');
  st.hidden = false;
  st.className = 'status';
  st.innerHTML = '<span class="spinner"></span><span></span>';
  st.lastChild.textContent = t('searching-peer');

  const topic = TOPIC_PREFIX + code;

  es = subscribe(topic, async msg => {
    if (msg.t !== 'offer') return;
    if (joinedOnce) return;
    if (msg.ts < sessionStart - 15000) return;
    joinedOnce = true;

    st.innerHTML = '<span class="spinner"></span><span></span>';
    st.lastChild.textContent = t('offer-received');

    try{
      const answerSdp = await createAnswerSDP(msg.sdp);
      for (let i = 0; i < 3; i++){
        publish(topic, { t: 'answer', sdp: answerSdp, ts: Date.now() }).catch(() => {});
        await new Promise(r => setTimeout(r, 400));
      }
      if (es) { es.close(); es = null; }
      st.innerHTML = '<span class="spinner"></span><span></span>';
      st.lastChild.textContent = t('connecting');
    }catch(e){
      st.className = 'status err';
      st.textContent = t('nego-failed') + e.message;
    }
  }, () => {
    st.className = 'status err';
    st.textContent = t('signal-error');
  });
}

/* ============================================================
   12. Manuel
   ============================================================ */
async function manualHostConnect(){
  const raw = $('#host-answer-in').value.trim();
  if (!raw){ toast(t('paste-answer')); return; }
  try{
    const sdp = await unpackSDP(raw);
    await pc.setRemoteDescription({ type: 'answer', sdp });
    setHostStatus(t('answer-accepted'), 'spin');
  }catch(e){
    setHostStatus(t('answer-unreadable') + e.message, 'err');
  }
}
async function manualJoinGenerate(){
  const raw = $('#join-offer-in').value.trim();
  if (!raw){ toast(t('paste-offer')); return; }
  try{
    const offerSdp = await unpackSDP(raw);
    const answerSdp = await createAnswerSDP(offerSdp);
    $('#join-answer-out').value = await packSDP(answerSdp);
    $('#join-answer-box').hidden = false;
    $('#join-status').hidden = false;
    $('#join-status').className = 'status';
    $('#join-status').innerHTML = '<span class="spinner"></span><span></span>';
    $('#join-status').lastChild.textContent = t('connecting');
  }catch(e){
    toast(t('code-invalid') + e.message);
  }
}

/* ============================================================
   13. États de connexion
   ============================================================ */
let connectedOnce = false;

function onConnected(){
  if (connectedOnce) return;
  connectedOnce = true;

  if (offerTimer){ clearInterval(offerTimer); offerTimer = null; }
  if (es){ es.close(); es = null; }

  statePromise = new Promise(resolve => {
    stateResolve = resolve;
    setTimeout(resolve, 2500);
  });

  const cs = $('#conn-status');
  cs.className = 'status ok';
  cs.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = '🔒 ' + t('connected');
  cs.appendChild(span);

  const stats = $('#stats');
  if (stats) stats.hidden = false;

  startPing();
  startSessionTimer();
  vibrate(30);

  showView('v-main');
}

function onFatal(message){
  if (offerTimer){ clearInterval(offerTimer); offerTimer = null; }
  if (es){ es.close(); es = null; }
  stopPing(); stopSessionTimer();

  const cs = $('#conn-status');
  if (cs){
    cs.className = 'status err';
    cs.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = message;
    cs.appendChild(span);
  }
  toast(message);
}

function cleanup(){
  if (offerTimer){ clearInterval(offerTimer); offerTimer = null; }
  if (es){ try { es.close(); } catch(e){} es = null; }
  if (dc){ try { dc.close(); } catch(e){} dc = null; }
  if (pc){ try { pc.close(); } catch(e){} pc = null; }
  stopPing(); stopSessionTimer();

  connectedOnce = false;
  joinedOnce = false;
  statePromise = null; stateResolve = null;
  haveRemote = {};
  nidMap.clear();
  cancelled.clear();
  queue = [];
  busy = false;

  const stats = $('#stats');
  if (stats) stats.hidden = true;
}

function goHome(){
  cleanup();
  showView('v-home');
  const cs = $('#conn-status');
  cs.className = 'status';
  cs.innerHTML = '<span class="spinner"></span><span></span>';
  cs.lastChild.textContent = t('secure-connecting');
}

function startPing(){
  stopPing();
  const sendPing = () => {
    if (!dc || dc.readyState !== 'open') return;
    try { dc.send(JSON.stringify({ t: 'ping', ts: performance.now() })); } catch(e){}
  };
  sendPing();
  pingTimer = setInterval(sendPing, 5000);
}
function stopPing(){
  if (pingTimer){ clearInterval(pingTimer); pingTimer = null; }
  currentRtt = null;
}
function updateRttDisplay(){
  const el = $('#stat-rtt');
  if (!el) return;
  if (currentRtt == null){ el.textContent = '—'; el.className = ''; return; }
  const ms = Math.round(currentRtt);
  el.textContent = ms + ' ms';
  el.className = ms < 80 ? 'rtt-good' : ms < 250 ? 'rtt-mid' : 'rtt-bad';
}
function startSessionTimer(){
  stopSessionTimer();
  sessionStartTime = Date.now();
  const upd = () => {
    const sec = Math.floor((Date.now() - sessionStartTime) / 1000);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    const el = $('#stat-duration');
    if (el) el.textContent = m > 0 ? (m + ' min ' + s + ' s') : (s + ' s');
  };
  upd();
  sessionTimer = setInterval(upd, 1000);
}
function stopSessionTimer(){
  if (sessionTimer){ clearInterval(sessionTimer); sessionTimer = null; }
}

/* ============================================================
   14. Menu langue
   ============================================================ */
function openLangMenu(){
  const menu = $('#lang-menu');
  const btn  = $('#btn-lang');
  if (!menu || !btn) return;
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
}
function closeLangMenu(){
  const menu = $('#lang-menu');
  const btn  = $('#btn-lang');
  if (!menu || !btn) return;
  menu.hidden = true;
  btn.setAttribute('aria-expanded', 'false');
}
function setLanguage(newLang){
  if (!LANGUAGES.includes(newLang)) return;
  lang = newLang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(_){}
  applyI18n();
  closeLangMenu();
  toast(t('lang-changed'));
}

/* ============================================================
   15. Branchements UI
   ============================================================ */
$('#btn-theme').onclick = () => {
  const cur = currentTheme();
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  applyTheme(next);
  toast(t('theme-' + next));
};

$('#btn-lang').onclick = (e) => {
  e.stopPropagation();
  const menu = $('#lang-menu');
  if (menu.hidden) openLangMenu();
  else closeLangMenu();
};

document.querySelectorAll('#lang-menu button').forEach(b => {
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    setLanguage(b.dataset.lang);
  });
});

document.addEventListener('click', (e) => {
  const menu = $('#lang-menu');
  if (!menu || menu.hidden) return;
  if (!e.target.closest('.lang-wrap')) closeLangMenu();
});

/* === Effet ripple sur tous les boutons === */
document.addEventListener('pointerdown', e => {
  const btn = e.target.closest('.btn, .theme-toggle, .lang-menu button, .file .actions button, .file .actions a');
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
  const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.width = r.style.height = size + 'px';
  r.style.left = x + 'px';
  r.style.top  = y + 'px';
  btn.appendChild(r);
  setTimeout(() => r.remove(), 620);
});

$('#chk-manual').onchange = e => {
  mode = e.target.checked ? 'manual' : 'ntfy';
  $('#hint-home').innerHTML = t(mode === 'manual' ? 'hint-manual' : 'hint-auto');
};

$('#btn-send').onclick    = startHost;
$('#btn-receive').onclick = () => {
  const manual = (mode === 'manual');
  $('#join-code-card').hidden = manual;
  $('#join-manual').hidden = !manual;
  $('#join-status').hidden = true;
  $('#join-answer-box').hidden = true;
  $('#join-offer-in').value = '';
  $('#join-answer-out').value = '';
  showView('v-join');
  if (!manual) setTimeout(() => $('#join-code').focus(), 150);
};

$('#btn-cancel-host').onclick = goHome;
$('#btn-cancel-join').onclick = goHome;
$('#btn-back').onclick        = goHome;

$('#btn-clear').onclick = () => {
  if (!$('#file-list').children.length) return;
  if (!confirm(t('clear-confirm'))) return;
  $('#file-list').innerHTML = '';
};

function feedbackCopied(btn){
  if (!btn) return;
  btn.classList.add('copied');
  setTimeout(() => btn.classList.remove('copied'), 900);
}

$('#btn-copy-code').onclick = () => {
  const code = $('#host-code').textContent.trim();
  if (!code || code === '······') return;
  navigator.clipboard.writeText(code).then(
    () => { toast(t('code-copied')); feedbackCopied($('#btn-copy-code')); },
    () => toast(t('copy-impossible'))
  );
};
$('#btn-share-code').onclick = async () => {
  const code = $('#host-code').textContent.trim();
  if (!code || code === '······') return;
  const text = t('share-text', { code });
  if (navigator.share){
    try { await navigator.share({ title: t('share-title'), text }); return; } catch(_){}
  }
  try { await navigator.clipboard.writeText(text); toast(t('copied')); feedbackCopied($('#btn-share-code')); }
  catch(_) { toast(t('share-unavailable')); }
};

$('#btn-join').onclick   = joinWithCode;
$('#join-code').onkeydown = e => { if (e.key === 'Enter') joinWithCode(); };

$('#btn-copy-offer').onclick   = () => copyField($('#host-offer')).then(() => feedbackCopied($('#btn-copy-offer')));
$('#btn-copy-answer').onclick  = () => copyField($('#join-answer-out')).then(() => feedbackCopied($('#btn-copy-answer')));
$('#btn-host-connect').onclick = manualHostConnect;
$('#btn-join-gen').onclick     = manualJoinGenerate;

$('#btn-pick').onclick = () => $('#file-input').click();
$('#file-input').onchange = e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (files.length) queueFiles(files);
};

window.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    const menu = $('#lang-menu');
    if (menu && !menu.hidden){ closeLangMenu(); return; }
    const active = $('.view.active');
    if (active && active.id !== 'v-home') goHome();
  }
});

let dragCount = 0;
window.addEventListener('dragenter', e => {
  if (!dc || dc.readyState !== 'open') return;
  e.preventDefault();
  dragCount++;
  document.body.classList.add('dragging');
});
window.addEventListener('dragleave', e => {
  dragCount = Math.max(0, dragCount - 1);
  if (dragCount === 0) document.body.classList.remove('dragging');
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  dragCount = 0;
  document.body.classList.remove('dragging');
  if (!dc || dc.readyState !== 'open'){ toast(t('connect-first')); return; }
  const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
  if (files.length) queueFiles(files);
});

/* ============================================================
   16. Init
   ============================================================ */
updateMetaThemeColor();
applyI18n();
window.matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', updateMetaThemeColor);

if (!(window.crypto && crypto.subtle)){
  console.warn("crypto.subtle indisponible : vérification par empreinte désactivée.");
}

})();
